name: Release MSFS 2024 Package

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag da release (ex: v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish GitHub Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Determine release version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch' -and '${{ github.event.inputs.tag_name }}' -ne '') {
            $raw = '${{ github.event.inputs.tag_name }}'
          } elseif ('${{ github.ref }}' -like 'refs/tags/*') {
            $raw = '${{ github.ref_name }}'
          } else {
            $pkg = Get-Content package.json -Raw | ConvertFrom-Json
            $raw = 'v' + $pkg.version.TrimStart('v')
          }
          $clean = $raw.TrimStart('v')
          "tag=$raw" >> $env:GITHUB_OUTPUT
          "version=$clean" >> $env:GITHUB_OUTPUT

      - name: Run unit & integration tests
        run: npm test

      - name: Build MSFS 2024 Community package
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: npm run build

      - name: Compile Standalone Windows Installer (EXE)
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/build-installer-exe.ps1 -Version ${{ steps.version.outputs.version }}

      - name: Create Release ZIP archives
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/p42-util-airspace-acars" -DestinationPath "p42-util-airspace-acars.zip" -Force
          Copy-Item "p42-util-airspace-acars.zip" "p42-util-airspace-acars-v${{ steps.version.outputs.version }}.zip" -Force
          if (Test-Path "dist/Airspace-ACARS-Installer") {
            Compress-Archive -Path "dist/Airspace-ACARS-Installer" -DestinationPath "Airspace-ACARS-Installer.zip" -Force
            Copy-Item "Airspace-ACARS-Installer.zip" "Airspace-ACARS-Installer-v${{ steps.version.outputs.version }}.zip" -Force
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "Airspace ACARS for Flow Pro (MSFS 2024) ${{ steps.version.outputs.tag }}"
          generate_release_notes: true
          files: |
            dist/Airspace-ACARS-Setup.exe
            dist/Airspace-ACARS-Setup-v${{ steps.version.outputs.version }}.exe
            p42-util-airspace-acars.zip
            p42-util-airspace-acars-v${{ steps.version.outputs.version }}.zip
            Airspace-ACARS-Installer.zip
            Airspace-ACARS-Installer-v${{ steps.version.outputs.version }}.zip
          body: |
            ## Airspace ACARS — Parallel 42 Flow Pro (MSFS 2024 / MSFS 2020)

            Integração oficial do **Airspace ACARS** para o **Parallel 42 Flow Pro** no **Microsoft Flight Simulator 2024**.

            ### Recursos Incluídos
            - **vOCC & Mensagens**: Recebimento em tempo real, alertas flutuantes no cockpit, confirmação de leitura (`WILCO` / `Confirmar`) e envio de mensagens diretas para o despacho / vOCC.
            - **Aeroportos & Documentos**: Pesquisa rápida por código ICAO ou título, atalhos automáticos para os aeroportos do voo ativo (`DEP`, `ARR`, `ALT`) e aeroporto mais próximo no MSFS 2024, filtros de categoria e leitor seguro integrado.
            - **Conexão Multi-VA (Device Code OAuth)**: Seletor de Virtual Airlines da rede Airspace com login via código de dispositivo sem sair do simulador e troca rápida entre VAs salvas.
            - **Integração com a Barra Otto**: Pesquise `doc SBGR`, `briefing SBRJ`, `vocc WILCO`, `notam` ou `acars` diretamente na barra Otto do Flow.
            - **Sistema de Atualizações Inteligente**: Notificação no cockpit quando houver nova versão com verificação de simulador em execução.

            ### Opções de Instalação (MSFS 2024 / MSFS 2020)

            #### Opção 1: Instalador Executável Direto (Recomendado)
            1. Baixe o arquivo **`Airspace-ACARS-Setup.exe`** abaixo.
            2. Certifique-se de que o Microsoft Flight Simulator esteja fechado.
            3. Dê um duplo-clique no executável, aceite os Termos de Uso e clique em **Instalar / Atualizar**.
            4. Abra o simulador, abra a roda do Flow Pro no cockpit e ative o **Airspace ACARS**.

            #### Opção 2: Instalação Manual via ZIP
            1. Baixe o arquivo **`p42-util-airspace-acars.zip`** abaixo.
            2. Extraia a pasta `p42-util-airspace-acars` diretamente dentro da sua pasta **`Community`** do Microsoft Flight Simulator.
            3. No MSFS, abra a roda do **Flow Pro**, entre no modo de edição e adicione o widget **Airspace ACARS**.
