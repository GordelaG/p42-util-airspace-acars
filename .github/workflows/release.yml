name: Release MSFS 2024 Package

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag da release (ex: v1.0.14)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish GitHub Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Determine release version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch' -and '${{ github.event.inputs.tag_name }}' -ne '') {
            $raw = '${{ github.event.inputs.tag_name }}'
          } elseif ('${{ github.ref }}' -like 'refs/tags/*') {
            $raw = '${{ github.ref_name }}'
          } else {
            $pkg = Get-Content package.json -Raw | ConvertFrom-Json
            $raw = 'v' + $pkg.version.TrimStart('v')
          }
          $clean = $raw.TrimStart('v')
          "tag=$raw" >> $env:GITHUB_OUTPUT
          "version=$clean" >> $env:GITHUB_OUTPUT

      - name: Run unit & integration tests
        run: npm test

      - name: Build MSFS 2024 Community package
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: npm run build

      - name: Compile Inno Setup Installer (AirspaceACARS-Setup.exe)
        shell: pwsh
        run: |
          $isccPath = "C:\Program Files (x86)\Inno Setup 6\iscc.exe"
          if (-not (Test-Path $isccPath)) {
            Write-Host "Installing Inno Setup via Chocolatey..."
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $isccPath)) {
            $isccPath = (Get-Command iscc -ErrorAction SilentlyContinue)?.Source
          }
          if (-not $isccPath) {
            throw "iscc.exe was not found after installing innosetup!"
          }
          Write-Host "Compiling Inno Setup Installer with $isccPath..."
          & $isccPath /DMyAppVersion="${{ steps.version.outputs.version }}" installer.iss

          if (-not (Test-Path "installer_output/AirspaceACARS-Setup.exe")) {
            throw "AirspaceACARS-Setup.exe was not created in installer_output!"
          }
          Write-Host "Installer created successfully: installer_output/AirspaceACARS-Setup.exe"

          Write-Host "Packaging Community ZIP for automatic updates..."
          Compress-Archive -Path "dist/p42-util-airspace-acars" -DestinationPath "installer_output/p42-util-airspace-acars.zip" -Force
          if (-not (Test-Path "installer_output/p42-util-airspace-acars.zip")) {
            throw "p42-util-airspace-acars.zip was not created in installer_output!"
          }
          Write-Host "ZIP package created successfully: installer_output/p42-util-airspace-acars.zip"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "Airspace ACARS for Flow Pro (MSFS 2024) ${{ steps.version.outputs.tag }}"
          generate_release_notes: true
          files: |
            installer_output/AirspaceACARS-Setup.exe
            installer_output/p42-util-airspace-acars.zip
          body: |
            ## Airspace ACARS — Parallel 42 Flow Pro (MSFS 2024 / MSFS 2020)

            Instalador oficial do **Airspace ACARS** para o **Parallel 42 Flow Pro** no **Microsoft Flight Simulator**.

            ### Recursos Incluídos
            - **vOCC & Mensagens**: Recebimento em tempo real, alertas flutuantes no cockpit, confirmação de leitura (`WILCO` / `Confirmar`) e envio de mensagens diretas para o despacho / vOCC.
            - **Aeroportos & Documentos**: Pesquisa rápida por código ICAO ou título, atalhos automáticos para os aeroportos do voo ativo (`DEP`, `ARR`, `ALT`) e aeroporto mais próximo no MSFS 2024, filtros de categoria e leitor seguro integrado.
            - **Conexão Multi-VA (Device Code OAuth)**: Seletor de Virtual Airlines da rede Airspace com login via código de dispositivo sem sair do simulador e troca rápida entre VAs salvas.
            - **Suporte Multilíngue e Tema White/Dark**: Suporte nativo a Português (pt-BR), Inglês (en), Espanhol (es) e Francês (fr) com alternância de tema visual claro/escuro.
            - **Sistema de Atualizações Inteligente**: Notificação no cockpit quando houver nova versão com verificação de simulador em execução e instalador automatizado.

            ### 📥 Download Único:
            - **`AirspaceACARS-Setup.exe`**: Baixe e execute o instalador padrão do Windows.
